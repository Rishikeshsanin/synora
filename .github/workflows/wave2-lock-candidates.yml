name: Wave 2 lock candidates
# Temporary resolver-only job. Not a release check and never deploys.
on:
  pull_request:
    paths:
      - .github/workflows/wave2-lock-candidates.yml
permissions:
  contents: read
concurrency:
  group: synora-lock-candidates-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  python:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        component: [pip-bootstrap, api-dev, qa]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Isolated resolver (not application install)
        run: |
          python3.12 -m venv "$RUNNER_TEMP/resolver"
          "$RUNNER_TEMP/resolver/bin/pip" install pip-tools==7.5.0
      - name: Generate candidate lock
        env:
          COMPONENT: ${{ matrix.component }}
        run: |
          set -euo pipefail
          case "$COMPONENT" in
            pip-bootstrap) printf 'pip==26.2\n' > "$RUNNER_TEMP/requirements.in" ;;
            api-dev) cat apps/api/requirements.txt > "$RUNNER_TEMP/requirements.in"; printf 'pytest==9.0.3\nruff==0.12.2\nmypy==1.16.1\npip-audit==2.9.0\n' >> "$RUNNER_TEMP/requirements.in" ;;
            music) printf 'ruff==0.12.2\nmypy==1.16.1\npip-audit==2.9.0\n' > "$RUNNER_TEMP/requirements.in" ;;
            media) cat engines/media/requirements.txt > "$RUNNER_TEMP/requirements.in"; printf 'ruff==0.12.2\nmypy==1.16.1\npip-audit==2.9.0\n' >> "$RUNNER_TEMP/requirements.in" ;;
            qa) printf 'pytest==9.0.3\nhttpx==0.28.1\nplaywright==1.51.0\npip-audit==2.9.0\n' > "$RUNNER_TEMP/requirements.in" ;;
          esac
          "$RUNNER_TEMP/resolver/bin/pip-compile" --allow-unsafe --generate-hashes --no-emit-index-url --no-emit-trusted-host --output-file="$RUNNER_TEMP/candidate.lock" "$RUNNER_TEMP/requirements.in"
          python3 -c 'import pathlib,os; print("\n".join("SYNORA_LOCK_LINE "+line for line in (pathlib.Path(os.environ["RUNNER_TEMP"])/"candidate.lock").read_text().splitlines()))'
