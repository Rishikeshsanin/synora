name: Wave 2 lock candidates
# Temporary resolver-only job. Not a release check and never deploys.
on:
  pull_request:
    paths:
      - .github/workflows/wave2-lock-candidates.yml
permissions:
  contents: read
concurrency:
  group: synora-lock-candidates-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  npm:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 6f39aa57a8183048a7b9cbe02e5895fb49190354
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - working-directory: apps/web
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          # Public generated dependency metadata only, never environment or credentials.
          python3 -c 'import pathlib; print("\n".join("SYNORA_LOCK_LINE "+line for line in pathlib.Path("package-lock.json").read_text().splitlines()))'
  python:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        component: [api-runtime, api-dev, music, media, qa]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Isolated resolver (not application install)
        run: |
          python3.12 -m venv "$RUNNER_TEMP/resolver"
          "$RUNNER_TEMP/resolver/bin/pip" install pip-tools==7.5.0
      - name: Generate candidate lock
        env:
          COMPONENT: ${{ matrix.component }}
        run: |
          set -euo pipefail
          case "$COMPONENT" in
            api-runtime) cp apps/api/requirements.txt "$RUNNER_TEMP/requirements.in" ;;
            api-dev) cat apps/api/requirements.txt > "$RUNNER_TEMP/requirements.in"; printf 'pytest==8.4.1\nruff==0.12.2\nmypy==1.16.1\npip-audit==2.9.0\n' >> "$RUNNER_TEMP/requirements.in" ;;
            music) printf 'ruff==0.12.2\nmypy==1.16.1\npip-audit==2.9.0\n' > "$RUNNER_TEMP/requirements.in" ;;
            media) cat engines/media/requirements.txt > "$RUNNER_TEMP/requirements.in"; printf 'ruff==0.12.2\nmypy==1.16.1\npip-audit==2.9.0\n' >> "$RUNNER_TEMP/requirements.in" ;;
            qa) printf 'pytest==8.4.1\nhttpx==0.28.1\nplaywright==1.51.0\npip-audit==2.9.0\n' > "$RUNNER_TEMP/requirements.in" ;;
          esac
          "$RUNNER_TEMP/resolver/bin/pip-compile" --generate-hashes --no-emit-index-url --no-emit-trusted-host --output-file="$RUNNER_TEMP/candidate.lock" "$RUNNER_TEMP/requirements.in"
          python3 -c 'import pathlib,os; print("\n".join("SYNORA_LOCK_LINE "+line for line in (pathlib.Path(os.environ["RUNNER_TEMP"])/"candidate.lock").read_text().splitlines()))'
