name: Synora CI
on:
  pull_request:
  push:
    branches: [main, integration/m1-foundation, 'agent/devops/verify-*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: synora-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  foundation:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - run: python3 -m unittest discover -s infrastructure/tests -v
      - name: Compose validation
        env:
          SYNORA_LOCAL_DB_PASSWORD: local-validation-only
        run: docker compose -f infrastructure/compose.yaml config --quiet
      - name: Scan Git history for secrets (redacted)
        run: docker run --rm -v "$PWD:/repo:ro" ghcr.io/gitleaks/gitleaks:v8.24.3 git /repo --redact --no-banner
  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Locked dependencies
        id: deps
        run: |
          test -f package-lock.json || { echo "::error::Frontend owner must commit package-lock.json"; exit 1; }
          npm ci --ignore-scripts
      - run: npm audit --audit-level=high
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
      - run: npm run lint
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
      - run: npm run typecheck
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
      - run: npm test
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
      - run: npm run build
        id: build
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
      - name: Frontend Chromium acceptance
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          npx --no-install playwright install --with-deps chromium
          npm run test:browser
  rls:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Disposable PostgreSQL migration and RLS
        run: |
          bash infrastructure/ci/start-db.sh
          bash infrastructure/ci/psql.sh < apps/api/tests/rls_smoke.sql
      - name: Remove disposable database
        if: always()
        run: docker rm -f -v synora-ci-db || test -z "$(docker ps -aq --filter name=^/synora-ci-db$)"
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: bash infrastructure/ci/ffmpeg.sh
      - name: Python 3.12 locked environment
        id: deps
        run: bash infrastructure/ci/venv.sh apps/api/requirements-dev.lock
      - run: python -m pip_audit --strict
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
      - run: python -m ruff check .
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        working-directory: apps/api
      - run: python -m mypy --namespace-packages --explicit-package-bases synora
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        env:
          PYTHONPATH: ${{ github.workspace }}/apps/api:${{ github.workspace }}
          MYPYPATH: ${{ github.workspace }}/apps/api:${{ github.workspace }}
        working-directory: apps/api
      - name: Disposable database
        id: db
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: bash infrastructure/ci/start-db.sh
      - name: Backend tests (database required)
        if: ${{ !cancelled() && steps.db.outcome == 'success' }}
        run: |
          source infrastructure/ci/fixture-env.sh
          export API_PUBLIC_URL=http://testserver
          export PYTHONPATH="$GITHUB_WORKSPACE/apps/api:$GITHUB_WORKSPACE"
          python -m pytest -q -rs apps/api/tests --junitxml="$RUNNER_TEMP/backend.xml"
          python "$GITHUB_WORKSPACE/infrastructure/ci/assert-no-skips.py" "$RUNNER_TEMP/backend.xml"
      - name: Collect backend-evidence counts only
        if: always()
        run: python3.12 infrastructure/ci/evidence.py junit "$RUNNER_TEMP/backend-evidence/summary.json" "$RUNNER_TEMP/backend.xml"
      - name: Upload backend-evidence (sanitized)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: backend-evidence
          path: ${{ runner.temp }}/backend-evidence/summary.json
          retention-days: 7
          if-no-files-found: error
      - name: Remove disposable database
        if: always()
        run: docker rm -f -v synora-ci-db || test -z "$(docker ps -aq --filter name=^/synora-ci-db$)"
  api-image:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Build locked API image
        id: image
        run: docker build -f infrastructure/docker/api.Dockerfile -t synora-api:ci .
      - name: Verify image startup and health
        run: |
          docker run -d --name synora-ci-api -p 127.0.0.1:18000:8000 synora-api:ci
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:18000/health; then exit 0; fi
            sleep 1
          done
          docker logs synora-ci-api
          exit 1
      - name: Remove test container
        if: always()
        run: docker rm -f -v synora-ci-api || test -z "$(docker ps -aq --filter name=^/synora-ci-api$)"
      - name: Install locked black-box QA dependencies
        id: qa_deps
        if: ${{ !cancelled() && steps.image.outcome == 'success' }}
        run: bash infrastructure/ci/venv.sh tests/requirements-dev.lock
      - name: Audit QA environment
        if: ${{ !cancelled() && steps.qa_deps.outcome == 'success' }}
        run: python -m pip_audit --strict
      - name: Create disposable database for containerized services
        id: db
        if: ${{ !cancelled() && steps.qa_deps.outcome == 'success' }}
        run: bash infrastructure/ci/start-db.sh
      - name: Real API and worker containers with private shared media
        if: ${{ !cancelled() && steps.db.outcome == 'success' }}
        run: bash infrastructure/ci/container-fixture.sh
      - name: Collect container-evidence counts only
        if: always()
        run: python3.12 infrastructure/ci/evidence.py junit "$RUNNER_TEMP/container-evidence/summary.json" "$RUNNER_TEMP/container-live.xml"
      - name: Upload container-evidence (sanitized)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: container-evidence
          path: ${{ runner.temp }}/container-evidence/summary.json
          retention-days: 7
          if-no-files-found: error
      - name: Remove disposable containers
        if: always()
        run: |
          for name in synora-ci-fixture-api synora-ci-fixture-worker synora-ci-db; do
            if docker inspect "$name" >/dev/null 2>&1; then
              docker rm -f -v "$name"
            fi
          done
  music:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Verify Python and FFmpeg
        run: bash infrastructure/ci/ffmpeg.sh
      - name: Music engine tests (stdlib, fake transport)
        run: python3.12 -m unittest discover -s engines/music/tests -v
  music-quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: bash infrastructure/ci/venv.sh engines/music/requirements-dev.lock
        id: deps
      - run: python -m pip_audit --strict
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
      - run: python -m ruff check engines/music benchmarks/music
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
      - name: Install compatible API runtime lock for boundary typing
        id: boundary_deps
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: |
          python -m pip install --require-hashes -r engines/music/requirements-dev.lock -r apps/api/requirements.lock
          python -m pip check
      - name: Audit combined music and API dependencies
        if: ${{ !cancelled() && steps.boundary_deps.outcome == 'success' }}
        run: python -m pip_audit --strict
      - name: Typecheck all music modules including backend boundary
        if: ${{ !cancelled() && steps.boundary_deps.outcome == 'success' }}
        env:
          MYPYPATH: ${{ github.workspace }}/apps/api:${{ github.workspace }}
        run: python -m mypy --namespace-packages --explicit-package-bases engines/music
      - name: Execute shared engine/backend boundary
        if: ${{ !cancelled() && steps.boundary_deps.outcome == 'success' }}
        env:
          PYTHONPATH: ${{ github.workspace }}/apps/api:${{ github.workspace }}
        run: |
          bash infrastructure/ci/ffmpeg.sh
          python engines/music/verify_backend_boundary.py
  media:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: bash infrastructure/ci/ffmpeg.sh
      - run: bash infrastructure/ci/venv.sh engines/media/requirements-dev.lock
        id: deps
      - run: python -m pip_audit --strict
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
      - run: python -m ruff check engines/media engines/creative benchmarks/media
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
      - run: python -m mypy --namespace-packages --explicit-package-bases engines/media engines/creative
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
      - run: python -m unittest discover -s benchmarks/media -p 'test_*.py' -v
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        env:
          OPENBLAS_NUM_THREADS: '1'
      - run: python -m benchmarks.media.demo "$RUNNER_TEMP/synora-ad-demo"
        id: preview
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        env:
          OPENBLAS_NUM_THREADS: '1'
      - run: python -m benchmarks.media.wave2_demo "$RUNNER_TEMP/synora-wave2-demo"
        id: hd
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        env:
          OPENBLAS_NUM_THREADS: '1'
      - name: Render classic/editorial A/B in all three ratios (generated fixtures only)
        id: editorial
        if: ${{ !cancelled() && steps.hd.outcome == 'success' }}
        env:
          OPENBLAS_NUM_THREADS: '1'
        run: python -m benchmarks.media.editorial_demo "$RUNNER_TEMP/synora-wave2-demo/product-0.png" "$RUNNER_TEMP/synora-wave2-demo/original.wav" "$RUNNER_TEMP/synora-editorial-demo"
      - name: Stage verified synthetic render evidence
        id: media_evidence
        if: ${{ !cancelled() && steps.preview.outcome == 'success' && steps.hd.outcome == 'success' && steps.editorial.outcome == 'success' }}
        run: python infrastructure/ci/evidence.py media "$RUNNER_TEMP" "$RUNNER_TEMP/synora-render-evidence"
      - name: Upload synthetic-render-evidence (sanitized)
        if: ${{ !cancelled() && steps.media_evidence.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: synthetic-render-evidence
          path: ${{ runner.temp }}/synora-render-evidence/
          retention-days: 7
          if-no-files-found: error
  qa-db:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: bash infrastructure/ci/ffmpeg.sh
      - run: bash infrastructure/ci/venv.sh apps/api/requirements-dev.lock
        id: deps
      - run: python -m pip_audit --strict
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
      - run: bash infrastructure/ci/start-db.sh
        id: db
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
      - name: Independent disposable worker acceptance
        if: ${{ !cancelled() && steps.db.outcome == 'success' }}
        run: |
          source infrastructure/ci/fixture-env.sh
          export API_PUBLIC_URL=http://testserver
          export PYTHONPATH="$GITHUB_WORKSPACE/apps/api:$GITHUB_WORKSPACE"
          export SYNORA_QA_DISPOSABLE_DB=1 SYNORA_QA_REQUIRE_DB=1
          python -m pytest -q -rs tests/integration/test_wave2_worker.py --junitxml="$RUNNER_TEMP/qa-db.xml"
          python infrastructure/ci/assert-no-skips.py "$RUNNER_TEMP/qa-db.xml"
      - name: Collect worker-evidence counts only
        if: always()
        run: python3.12 infrastructure/ci/evidence.py junit "$RUNNER_TEMP/worker-evidence/summary.json" "$RUNNER_TEMP/qa-db.xml"
      - name: Upload worker-evidence (sanitized)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: worker-evidence
          path: ${{ runner.temp }}/worker-evidence/summary.json
          retention-days: 7
          if-no-files-found: error
      - name: Remove disposable database
        if: always()
        run: docker rm -f -v synora-ci-db || test -z "$(docker ps -aq --filter name=^/synora-ci-db$)"
  integrated:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:8000
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:19090
      NEXT_PUBLIC_SUPABASE_ANON_KEY: synthetic-loopback-test-key
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: bash infrastructure/ci/ffmpeg.sh
      - run: bash infrastructure/ci/venv.sh tests/requirements-dev.lock
        id: qa_deps
      - run: python -m pip_audit --strict
        if: ${{ !cancelled() && steps.qa_deps.outcome == 'success' }}
      - run: python -m pytest -q tests/integration/test_contract_shapes.py --junitxml="$RUNNER_TEMP/contracts.xml"
        if: ${{ !cancelled() && steps.qa_deps.outcome == 'success' }}
      - name: API runtime lock
        id: api_deps
        if: ${{ !cancelled() && steps.qa_deps.outcome == 'success' }}
        run: |
          python -m pip install --require-hashes -r tests/requirements-dev.lock -r apps/api/requirements.lock
          python -m pip check
      - run: python -m pip_audit --strict
        if: ${{ !cancelled() && steps.api_deps.outcome == 'success' }}
      - run: bash infrastructure/ci/start-db.sh
        id: db
        if: ${{ !cancelled() && steps.api_deps.outcome == 'success' }}
      - name: Start local fixture services
        id: api
        if: ${{ !cancelled() && steps.db.outcome == 'success' }}
        run: |
          source infrastructure/ci/fixture-env.sh
          export SYNORA_QA_REQUIRE_LIVE=1 SYNORA_QA_FIXTURE_POSTS=1
          export SYNORA_QA_API_URL="$API_PUBLIC_URL"
          export PYTHONPATH="$GITHUB_WORKSPACE/apps/api:$GITHUB_WORKSPACE"
          python -m uvicorn synora.api:app --host 127.0.0.1 --port 8000 --no-access-log > "$RUNNER_TEMP/synora-api.log" 2>&1 &
          python -m synora.worker > "$RUNNER_TEMP/synora-worker.log" 2>&1 &
          echo "$!" > "$RUNNER_TEMP/synora-worker.pid"
          bash infrastructure/ci/wait-http.sh "$API_PUBLIC_URL/ready"
      - name: Live API acceptance
        if: ${{ !cancelled() && steps.api.outcome == 'success' }}
        run: |
          source infrastructure/ci/fixture-env.sh
          export SYNORA_QA_REQUIRE_LIVE=1 SYNORA_QA_FIXTURE_POSTS=1 SYNORA_QA_API_URL="$API_PUBLIC_URL"
          # Distinct fixture owners preserve the browser accounts\u0027 ordinary rate budget.
          export SYNORA_QA_TOKEN_A="$SYNORA_QA_LIVE_TOKEN_A" SYNORA_QA_TOKEN_B="$SYNORA_QA_LIVE_TOKEN_B"
          python -m pytest -q -rs tests/integration/test_live_api.py --junitxml="$RUNNER_TEMP/live.xml"
          python infrastructure/ci/assert-no-skips.py "$RUNNER_TEMP/live.xml"
      - name: Build and start web (local API)
        id: web
        if: ${{ !cancelled() && steps.api.outcome == 'success' }}
        working-directory: apps/web
        env:
          NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:8000
        run: |
          npm ci --ignore-scripts
          npm run build
          npm run start -- --hostname 127.0.0.1 --port 3000 > "$RUNNER_TEMP/synora-web.log" 2>&1 &
          bash "$GITHUB_WORKSPACE/infrastructure/ci/wait-http.sh" http://127.0.0.1:3000
      - name: Install Chromium
        id: chromium
        if: ${{ !cancelled() && steps.web.outcome == 'success' }}
        run: python -m playwright install --with-deps chromium
      - name: Prepare two native Studio sessions (Issue #29)
        id: native_fixture
        if: ${{ !cancelled() && steps.chromium.outcome == 'success' }}
        env:
          SYNORA_QA_WEB_URL: http://127.0.0.1:3000
        run: |
          set -euo pipefail
          source infrastructure/ci/fixture-env.sh
          export SYNORA_QA_FIXTURE_POSTS=1 SYNORA_QA_API_URL="$API_PUBLIC_URL"
          test -f tests/e2e/setup_ci_fixture.sh || { echo "::error::Issue #29 fixture setup is missing"; exit 1; }
          source tests/e2e/setup_ci_fixture.sh
          python infrastructure/ci/validate-browser-fixture.py
          # Persist paths and public identifiers only; credentials remain masked/private.
          for name in SYNORA_QA_FIXTURE_PAGE_URL SYNORA_QA_STORAGE_STATE SYNORA_QA_STORAGE_STATE_B SYNORA_QA_FIXTURE_JOB_ID; do
            printf '%s=%s\n' "$name" "${!name}" >> "$GITHUB_ENV"
          done
      - name: Strict browser acceptance (no skips)
        if: ${{ !cancelled() && steps.chromium.outcome == 'success' }}
        env:
          SYNORA_QA_REQUIRE_BROWSER: '1'
          SYNORA_QA_REQUIRE_BROWSER_API: '1'
          SYNORA_QA_WEB_URL: http://127.0.0.1:3000
        run: |
          source infrastructure/ci/fixture-env.sh
          export SYNORA_QA_FIXTURE_POSTS=1 SYNORA_QA_API_URL="$API_PUBLIC_URL"
          # Run every browser test even if fixture preparation failed.
          # The preparation step stays a hard failure; strict tests also fail closed.
          python -m pytest -q -rs tests/e2e --junitxml="$RUNNER_TEMP/browser.xml"
          python infrastructure/ci/assert-no-skips.py "$RUNNER_TEMP/browser.xml"
      - name: Collect integrated-evidence counts only
        if: always()
        run: python3.12 infrastructure/ci/evidence.py junit "$RUNNER_TEMP/integrated-evidence/summary.json" "$RUNNER_TEMP/contracts.xml" "$RUNNER_TEMP/live.xml" "$RUNNER_TEMP/browser.xml"
      - name: Upload integrated-evidence (sanitized)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: integrated-evidence
          path: ${{ runner.temp }}/integrated-evidence/summary.json
          retention-days: 7
          if-no-files-found: error
      - name: Remove disposable database
        if: always()
        run: docker rm -f -v synora-ci-db || test -z "$(docker ps -aq --filter name=^/synora-ci-db$)"
