# Disposable CPU-only fixture stack. Use local_smoke.py, not a deployment blueprint.
x-runtime: &runtime
  image: ${SYNORA_SMOKE_IMAGE:?Use local_smoke.py}
  pull_policy: never
  environment:
    SYNORA_ENV: test
    MUSIC_PROVIDER: fixture
    SYNORA_REAL_GENERATION_ENABLED: "false"
    SYNORA_REAL_MUSIC_APPROVED: "0"
    DATABASE_URL: postgresql://synora_smoke:${SYNORA_SMOKE_PASSWORD:?Use local_smoke.py}@postgres:5432/synora_smoke
    MEDIA_DIR: /var/lib/synora/media
    MEDIA_SIGNING_KEY: ${SYNORA_SMOKE_SIGNING_KEY:?Use local_smoke.py}
    API_PUBLIC_URL: http://127.0.0.1:${SYNORA_SMOKE_PORT:?Use local_smoke.py}
    CORS_ORIGINS: http://127.0.0.1:3000
    FIXTURE_TOKENS_JSON: ${SYNORA_SMOKE_TOKENS:?Use local_smoke.py}
  user: "10001:10001"
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  tmpfs:
    - /tmp:rw,noexec,nosuid,nodev,size=256m,mode=1777
  volumes:
    - media:/var/lib/synora/media
  depends_on:
    postgres:
      condition: service_healthy
  init: true
  pids_limit: 128
  restart: "no"
services:
  postgres:
    image: postgres:17.6
    environment:
      POSTGRES_DB: synora_smoke
      POSTGRES_USER: synora_smoke
      POSTGRES_PASSWORD: ${SYNORA_SMOKE_PASSWORD:?Use local_smoke.py}
    volumes:
      - database:/var/lib/postgresql/data
      - ./ci/auth-bootstrap.sql:/synora-init/auth-bootstrap.sql:ro
      - ../supabase/migrations:/synora-init/migrations:ro
      - ./local/init-db.sh:/docker-entrypoint-initdb.d/00-synora.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U synora_smoke -d synora_smoke"]
      interval: 2s
      timeout: 3s
      retries: 30
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 128
    restart: "no"
  api:
    <<: *runtime
    build:
      context: ..
      dockerfile: infrastructure/docker/api.Dockerfile
    ports:
      - "127.0.0.1:${SYNORA_SMOKE_PORT:?Use local_smoke.py}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready',timeout=3)"]
      interval: 2s
      timeout: 4s
      retries: 30
    mem_limit: 512m
    cpus: 1.0
  worker:
    <<: *runtime
    command: ["python", "-m", "synora.worker"]
    healthcheck:
      # The init process exits with the worker; check actual queue schema access
      # and write permission on the private shared volume, not a fake HTTP port.
      test: ["CMD", "python", "-c", "import os, pathlib, psycopg; p=pathlib.Path(os.environ['MEDIA_DIR']); assert p.is_dir() and os.access(p, os.W_OK|os.X_OK); c=psycopg.connect(os.environ['DATABASE_URL'],connect_timeout=3,options='-c statement_timeout=2000'); c.execute('select 1 from synora.jobs limit 0'); c.close()"]
      interval: 2s
      timeout: 5s
      retries: 30
    mem_limit: 768m
    cpus: 1.5
volumes:
  database:
  media:
